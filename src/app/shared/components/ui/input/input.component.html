<div class="flex flex-col gap-1 w-full">

  @if (label()) {
    <label [for]="inputId()" [class]="labelClasses()">
      {{ label() }}
      @if (required()) {
        <span class="text-[#e3082c] ml-0.5" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="relative flex items-center w-full">

    @if (iconLeft()) {
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none shrink-0"
        [innerHTML]="iconLeft()"
      ></span>
    }

    <input
      [id]="inputId()"
      [type]="showPassword() ? 'text' : type()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxlength() ?? null"
      [attr.min]="min() ?? null"
      [attr.max]="max() ?? null"
      [value]="value()"
      [class]="inputClasses()"
      (input)="onInput($event)"
      (blur)="onTouched()"
      (focus)="focused.set(true)"
    />

    @if (type() === 'password') {
      <button
        type="button"
        tabindex="-1"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        }
      </button>
    }

    @if (iconRight() && type() !== 'password') {
      <span
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none shrink-0"
        [innerHTML]="iconRight()"
      ></span>
    }

  </div>

  @if (hint() && !errorMessage()) {
    <p [class]="hintClasses()">{{ hint() }}</p>
  }

  @if (errorMessage()) {
    <p class="text-xs text-red-600 flex items-center gap-1" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
      </svg>
      {{ errorMessage() }}
    </p>
  }

</div>
