<div class="flex items-start justify-between gap-4 mb-5 md:mb-6">
  <div class="flex flex-col gap-1">
    @if (eyebrow()) {
      <span class="text-xs font-semibold text-[#e3082c] uppercase tracking-widest">
        {{ eyebrow() }}
      </span>
    }
    <h2 class="text-xl font-bold text-gray-900 sm:text-2xl leading-tight">
      {{ title() }}
    </h2>
    @if (subtitle()) {
      <p class="text-sm text-gray-500 mt-0.5 max-w-xl">{{ subtitle() }}</p>
    }
  </div>

  @if (linkLabel() && linkPath()) {
    <a
      [routerLink]="linkPath()"
      class="inline-flex items-center gap-1 text-sm font-semibold text-[#e3082c] hover:text-[#c30726] transition-colors whitespace-nowrap shrink-0 mt-1"
      [attr.aria-label]="linkLabel() + ' – ' + title()"
    >
      {{ linkLabel() }}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </a>
  }
</div>
