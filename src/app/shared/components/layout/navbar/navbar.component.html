<header class="sticky top-0 z-50 w-full bg-white border-b border-gray-200">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center h-16 gap-4">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 shrink-0" aria-label="Meetup">
        <span class="w-8 h-8 rounded-lg bg-[#e3082c] flex items-center justify-center">
          <span class="text-white font-bold text-sm leading-none">m</span>
        </span>
        <span class="font-bold text-base text-gray-900 hidden sm:block">meetup</span>
      </a>

      <!-- Desktop search bar -->
      <div class="hidden md:flex items-center flex-1 max-w-md border border-gray-200 rounded-full bg-gray-50 overflow-hidden">
        <input
          type="text"
          placeholder="Buscar eventos..."
          class="flex-1 min-w-0 pl-4 pr-2 py-2 text-sm bg-transparent text-gray-900 placeholder-gray-400 outline-none"
        />
        <div class="w-px h-5 bg-gray-200 shrink-0"></div>
        <input
          type="text"
          placeholder="Ciudad..."
          class="w-28 px-3 py-2 text-sm bg-transparent text-gray-900 placeholder-gray-400 outline-none"
        />
        <button
          type="button"
          class="w-8 h-8 m-1 rounded-full bg-gray-900 flex items-center justify-center shrink-0 hover:bg-black transition-colors"
          aria-label="Buscar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
          </svg>
        </button>
      </div>

      <!-- Desktop nav links -->
      <div class="hidden md:flex items-center gap-1 ml-auto">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            [routerLinkActive]="'text-[#e3082c] font-semibold'"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Desktop auth buttons -->
      <div class="hidden md:flex items-center gap-2 shrink-0">
        <a
          routerLink="/login"
          class="px-5 py-2 rounded-full text-sm font-semibold text-gray-900 border border-gray-300 hover:bg-gray-50 transition-colors"
        >
          Iniciar sesión
        </a>
        <a
          routerLink="/register"
          class="px-5 py-2 rounded-full text-sm font-semibold text-white bg-[#e3082c] hover:bg-[#c30726] transition-colors"
        >
          Registrarse
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button
        type="button"
        class="md:hidden ml-auto w-10 h-10 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 transition-colors"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
        aria-label="Menú"
      >
        @if (menuOpen()) {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>

    </div>
  </nav>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <div class="md:hidden border-t border-gray-100 bg-white">
      <div class="px-4 py-3 space-y-2">
        <!-- Mobile search -->
        <div class="flex items-center border border-gray-200 rounded-full bg-gray-50 overflow-hidden">
          <input
            type="text"
            placeholder="Buscar eventos..."
            class="flex-1 pl-4 py-2.5 text-sm bg-transparent text-gray-900 placeholder-gray-400 outline-none"
          />
          <button class="w-9 h-9 m-0.5 rounded-full bg-gray-900 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
            </svg>
          </button>
        </div>

        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            [routerLinkActive]="'text-[#e3082c] font-semibold'"
            class="block px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50"
            (click)="closeMenu()"
          >{{ link.label }}</a>
        }

        <div class="pt-2 border-t border-gray-100 space-y-2">
          <a routerLink="/login" (click)="closeMenu()"
            class="block text-center px-4 py-2.5 rounded-full text-sm font-semibold text-gray-900 border border-gray-300">
            Iniciar sesión
          </a>
          <a routerLink="/register" (click)="closeMenu()"
            class="block text-center px-4 py-2.5 rounded-full text-sm font-semibold text-white bg-[#e3082c]">
            Registrarse
          </a>
        </div>
      </div>
    </div>
  }
</header>
