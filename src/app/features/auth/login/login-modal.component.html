<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [showHeader]="false"
  [style]="{ width: '100%', maxWidth: '420px', borderRadius: '1.25rem' }"
  [contentStyle]="{ padding: '0', borderRadius: '1.25rem', overflow: 'hidden' }"
  styleClass="auth-dialog"
>
  <div class="bg-white rounded-[1.25rem] p-8 flex flex-col items-center gap-5">

    <!-- Logo -->
    <div class="w-10 h-10 rounded-xl bg-[#e3082c] flex items-center justify-center">
      <span class="text-white font-bold text-lg leading-none">m</span>
    </div>

    <!-- Título -->
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-900">Inicia sesión</h2>
      <p class="text-sm text-gray-500 mt-1">
        ¿Nuevo en Meetup?
        <button
          (click)="onSwitchToRegister()"
          class="text-[#e3082c] font-semibold hover:underline ml-1 bg-transparent border-none cursor-pointer p-0"
        >
          Regístrate →
        </button>
      </p>
    </div>

    <!-- Formulario -->
    <div class="w-full flex flex-col gap-3">
      <input
        pInputText
        [(ngModel)]="email"
        type="email"
        placeholder="nombre@email.com"
        class="w-full"
      />

      <p-password
        [(ngModel)]="password"
        placeholder="Contraseña"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />

      <p-button
        label="Iniciar sesión"
        (onClick)="onLogin()"
        styleClass="w-full bg-[#e3082c] border-[#e3082c] hover:bg-[#c20626] justify-center rounded-full font-semibold text-base py-3"
      />

      <div class="text-right">
        <button class="text-sm text-[#e3082c] hover:underline bg-transparent border-none cursor-pointer p-0">
          ¿Olvidaste tu contraseña?
        </button>
      </div>
    </div>

    <!-- Divisor -->
    <div class="flex items-center gap-3 w-full">
      <div class="flex-1 border-t border-gray-200"></div>
      <span class="text-xs text-gray-400">o</span>
      <div class="flex-1 border-t border-gray-200"></div>
    </div>

    <!-- Google -->
    <button class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors bg-white cursor-pointer">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </button>

  </div>
</p-dialog>
